name : terraform deploy

on:
 workflow_dispatch:

  jobs:
    plan:
      runs-on: ubuntu-latest

      env:
        AWS_ACCESS.KEY_ID: ${{ secrets.AWS_ACCESS.KEY_ID }}
        AWS_SECURITY_ACCESS_KEY: ${{ secrets.AWS_SECURITY_ACCESS_KEY }}
        AWS_REGION: us-east-1

        steps:
          - name: Checkout
            uses: actions/checkout@v3
          - name: setup terraform
            uses: hashicorp/setup-terraform@v2
            with:
              terraform_version: 1.9.8
          - name: terraform init
            run: terraform init
          - name: terraform plan
            run: terraform plan -out=tfplan
          - name: artifact
            uses: actions/upload-artifact@v3
            with:
                name: tfplan
                path: tfplan

    apply:
      name: terraform apply
      runs-on: ubuntu-latest
      needs: plan
      environment: production

      env:
      aws_secret_acess_key: ${{ secrets.aws_secret_access_key }}
      aws_access_key_id: ${{ secrets.aws_acess_key_id }}

      steps:
        - name: checkout
          uses: actions/chekout@v3
        - name: setup terraform
          uses: hashicorp/setup-terraform@v2
          with:
              terraform_version: 1.9.8
        - name: download artifact
          uses: actions/download-artifact@v3
          with:
            name: tfplan
        - name: terraform apply
          run: terraform apply -auto-approve tfplan
